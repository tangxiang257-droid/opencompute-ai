name: Phase 1 contracts
on:
  pull_request:
    paths:
      - 'cluster_p1/contracts.py'
      - 'cluster_p1/store.py'
      - 'cluster_p1/__init__.py'
      - 'tests/test_p1_contracts.py'
      - 'tests/test_p1_store.py'
      - '.github/workflows/p1-contracts.yml'
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pydantic>=2.10,<3' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' numpy psutil requests
      - run: python -m unittest discover -s tests -p 'test_p1_contracts.py' -v
      - run: python -m unittest discover -s tests -p 'test_p1_store.py' -v
      - run: python -m unittest discover -s tests -p 'test_cluster_v03.py' -v
