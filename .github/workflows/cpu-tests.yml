name: CPU tensor parallel tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Small benchmark
        run: python -m benchmarks.run --hidden 64 --batch 4 --iterations 2
      - name: MLP communication-delay smoke test
        run: python -m benchmarks.mlp_latency --workers 2 --hidden 16 --expansion 32 --batch 2 --iterations 1
      - name: v0.2 attention and transformer block smoke test
        run: |
          python -m unittest tests.test_attention tests.test_block -v
