name: v0.3 heterogeneous CPU cluster
on:
  push:
    paths:
      - 'cluster_v03/**'
      - 'cluster_v031/**'
      - 'compute/rendezvous.py'
      - 'compute/gpt2_generate.py'
      - 'tests/test_rendezvous_v033.py'
      - 'tests/test_tp_v031.py'
      - 'tests/test_*_v032.py'
      - 'benchmarks/tp_session_demo.py'
      - 'tests/test_cluster_v03.py'
      - 'benchmarks/cluster_sim.py'
      - 'backend/app.py'
      - 'Dockerfile.worker'
      - 'docker-compose.yml'
      - 'requirements-dev.txt'
      - '.github/workflows/cluster-v03.yml'
  pull_request:
    paths:
      - 'cluster_v03/**'
      - 'cluster_v031/**'
      - 'compute/rendezvous.py'
      - 'compute/gpt2_generate.py'
      - 'tests/test_rendezvous_v033.py'
      - 'tests/test_tp_v031.py'
      - 'tests/test_*_v032.py'
      - 'benchmarks/tp_session_demo.py'
      - 'tests/test_cluster_v03.py'
      - 'benchmarks/cluster_sim.py'
      - 'backend/app.py'
      - 'Dockerfile.worker'
      - 'docker-compose.yml'
      - 'requirements-dev.txt'
      - '.github/workflows/cluster-v03.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight v0.3 dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Test scheduling, auth, leases, concurrent claims and Worker jobs
        run: python -m unittest discover -s tests -p 'test_cluster_v03.py' -v
      - name: Run managed TP session API and Gloo tests
        run: python -m unittest discover -s tests -p 'test_tp_v031.py' -v
      - name: v0.3.2 security and Worker cancellation regressions
        run: python -m unittest discover -s tests -p 'test_*_v032.py' -v
      - name: v0.3.3 owned-rendezvous and safe fresh-group retry regressions
        run: python -m unittest discover -s tests -p 'test_rendezvous_v033.py' -v
      - name: Run full localhost HTTP and two-agent TP demo
        run: python -m benchmarks.tp_session_demo
      - name: Simulate 3 heterogeneous devices without a cloud server
        run: python -m benchmarks.cluster_sim
